# 文件说明区：仅管理员可见。path 相对于 Cargo.toml 所在目录，支持 * 通配单层目录名。
File_Description:
  enabled: true
  # 文件说明区每页显示数量；超过此数量时前端分页。
  page_rows: 10
  # 文件说明区只展示这些扩展名；文件夹不受此列表影响。
  display_extensions:
    - txt
    - zip
    - xlsx
    - json
    - log
    - md
    - yaml
    - yml
    - csv
  # 打开文件说明区时，超过该天数的内容只提示一次。
  stale_days: 15
  # 相对于项目根目录的回收站目录；批量清理只移动，不永久删除。
  recycle_bin: .portal_recycle
  roots:
    - path: model/*/portal_outputs
      desc: 各模型任务输出
      recursive: true
    - path: model/*/portal_inputs
      desc: 各模型任务输入
      recursive: true
    - path: model/*/meter_output_*
      desc: 表计调试输出
      recursive: true
    - path: model/*/newwrap
      desc: 离线包 newwrap 输出
      recursive: true
    - path: model/*/output
      desc: 离线包或周报输出
      recursive: true
    - path: model/*/date_review/0Work
      desc: 周报基础工作目录
      recursive: true

# 模型推理能力白名单及显示顺序；不在此列表中的能力不显示。
