# 权限与功能标签页配置。
#
# 说明：
# - Feature_Tab_Visibility：控制用户登录后是否显示对应功能标签页。
#   true = 显示；false = 不显示。
# - Administrator_Rights：管理员权限。
# - Standard_Level_1_User_Privileges：普通一级用户权限。
# - Standard_Level_2_User_Privileges：普通二级用户权限。
# - 具体 model.* 权限仍控制标签页内部按钮是否可点击；即使标签页显示，按钮也必须有对应权限才可执行。
# - Feature_File_Display：控制处理文件区域允许显示的文件名；未配置的功能保持后端默认过滤规则。
# - Log_Display.max_visual_lines：控制运行日志内框每页最多显示的视觉行数；未配置时程序默认 27 行。
# - rows_downloaded_file_algorithm：依赖区每页显示的算法下载文件数量；未配置时默认 8 行。
# - 建议保持权限键名为 ASCII，减少不同编辑器保存 YAML 时的兼容问题。

# 后台浏览器自动化不使用系统默认浏览器。
# 键名使用工作区后端模型 ID；每个模型可以使用自己的浏览器版本和登录数据。
Browser_Path:
  annotation: 'model/Model-Annotation-tag-0.1.1+python/chrome/chrome.exe'
  weekly: 'model/Weekly-Report-Print-tag-0.0.8+python/date_review/chrome/chrome.exe'
# 浏览器用户数据目录固定在这里，登录一次后由后续自动化流程复用。
# 路径相对于项目根目录；配置优先级高于 RUST_PORTAL_USER_DATA_DIR。
Browser_User_Data_Dir:
  annotation: 'model/Model-Annotation-tag-0.1.1+python/chromium_user_data'
  weekly: 'model/Weekly-Report-Print-tag-0.0.8+python/date_review/chrome/Data'
rows_downloaded_file_algorithm: 8

# 通用模型标签页。固定标签页仍由 Rust/JavaScript 保持原实现；
# 这里的模型只需要提供受控 portal_entry.py 入口即可接入网页。
Tab_content:
  - id: model_descriptor_updater
    name: 模型描述更新
    description: 按 Algorithm_Order 白名单替换 model_descriptor.yaml 中的 param
    model_dir: Model_Descriptor_Updater-tag0.0.1+python
    entry: portal_entry.py
    Component_elements:
      import:
        - id: input_folder
          name: 导入文件夹（含 model_descriptor.yaml 与模型文件）
          kind: folder
          accept: .pt,.om,.yaml,.yml
          required: true
      changes:
        - id: run
          name: 执行替换
          description: 按白名单替换 yaml 中的 param
          action: run
      parameters:
        - id: ability_id
          name: 能力 ID（仅无锚点时生效）
          type: text
          default: ""
          required: false
        - id: anchor_override
          name: 锚点选择（仅在检测到多个候选时使用）
          type: text
          default: ""
          required: false
    parameter_combinations:
      - [ability_id, anchor_override]
    Log_Display: true
    Display_imported_folder: true

  - id: project_closing_ppt
    name: 结项报告
    description: 根据站点 xlsx 生成结项 PPT
    model_dir: Project_Closing_PPT-tag0.0.1+python
    entry: portal_entry.py
    Component_elements:
      import:
        - id: input_file
          name: 导入站点 xlsx（可留空以使用 config.xlsxway）
          kind: file
          accept: .xlsx
          required: false
      changes:
        - id: generate
          name: 生成结项 PPT
          description: 根据站点数据生成 PPT
          action: generate
      parameters:
        - id: station_name
          name: 站点名称
          type: text
          default: ""
          required: true
        - id: accuracy_field
          name: 准确率字段
          type: select
          default: 准确率
          options:
            - value: 准确率
              label: 准确率
            - value: 审核后准确率
              label: 审核后准确率
    parameter_combinations:
      - [station_name, accuracy_field]
    Log_Display: true
    Display_imported_folder: true
    
  - id: image_filtering
    name: 图片
    description: 图片相似分组、模糊图处理和样本报表。
    model_dir: Image_filtering_processing-tag0.0.1+python
    entry: portal_entry.py
    Component_elements:
      import:
        - id: image_folder
          name: 导入图片文件夹
          kind: folder
          accept: .png,.jpg,.jpeg,.bmp,.webp,.tif,.tiff
          required: false
        - id: image_file
          name: 导入单张图片
          kind: file
          accept: .png,.jpg,.jpeg,.bmp,.webp,.tif,.tiff
          required: false
      changes:
        - id: group_only
          name: 仅图片分组
          description: 只生成相似图分组和 XLSX 报表，不删除图片。
          action: group_only
        - id: group_and_clean
          name: 分组并清理
          description: 生成报表、备份 ZIP，并按参数处理模糊图和组内数量。
          action: group_and_clean
        - id: group_and_backup
          name: 分组并备份
          description: 生成报表和原图 ZIP，不删除图片。
          action: group_and_backup
      parameters:
        - id: blur_policy
          name: 模糊图片
          type: select
          default: remove
          options:
            - value: keep
              label: 保留
            - value: remove
              label: 删除模糊图
        - id: retention_count
          name: 每组保留数量
          type: number
          default: 3
          required: true
        - id: backup_zip
          name: 生成原图备份 ZIP
          type: checkbox
          default: true
    parameter_combinations:
      - [blur_policy, retention_count, backup_zip]
      - [blur_policy, backup_zip]
    Log_Display: true
    Latest_temporal_display_file:
      base: project
      file: Document/VERSION
      folder: Document
      recursive: false
      extensions: [md, yaml, yml, txt]
      display_folder: true
    Display_imported_folder: true

# 登录后功能标签页显示开关。
Feature_Tab_Visibility:
  # 管理员：默认显示全部功能标签页。
  Administrator_Rights:
    Log_Review: true
    Model-Annotation: true
    Offline_Package_Organization: true
    Weekly-Report-Print: true
    Trueno-Inference: true
    image_filtering: true
    project_closing_ppt: true
    model_descriptor_updater: true
    
  # 普通一级：默认只显示日志转换。
  Standard_Level_1_User_Privileges:
    Log_Review: false
    Model-Annotation: false
    Offline_Package_Organization: true
    Weekly-Report-Print: true
    Trueno-Inference: true
    image_filtering: false

  # 普通二级：默认显示全部业务功能标签页。
  Standard_Level_2_User_Privileges:
    Log_Review: false
    Model-Annotation: false
    Offline_Package_Organization: true
    Weekly-Report-Print: true
    Trueno-Inference: true
    image_filtering: true

