# 清单“解决方案”列的下拉选项，按此处顺序显示。
solution_optional:
  - 1.确定预置位标定是否正常 2.确保标定无问题的前提下，重新采集图片交予算法训练，预计下周更新优化
  - 1.图片存在模糊等影响识别因素 2.轻度模糊可以尝试重新采集，解决稍微模糊时的识别准确率，但是最好直接解决模糊问题，避免偶发性无法捕获图像目标
  - 1.偏移，想办法调整角度，尽可能正面面对识别对象 2.重新标定 3.仍无法识别再采集图片重新训练，但识别效果因为角度不好，缺失识别对象可能识别效果不好
  - 1.摄像头聚焦不清、遮掩或显示屏不显示又或黑白等图片内无识别对象性质问题，需要现场及时处理
  - 1.距离过远，需要识别对象占据图像80%以上大小，避免过小无法捕获识别对象或识别条件等算法识别必要因素
  - 1.系统偶发性异常或算法并发数不够、需要重新预置位验证
  - 1.优先更新最新算法模型，用于验证，无效后再采集针对优化
  - 1.算法存在识别目标，但是系统无输出结果 2.尝试预置位重新验证
