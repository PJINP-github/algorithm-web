# Web 审核导出时，是否把“问题图片”也保留在 accuracy 的 imagesData 中。
# y=保留，n=不保留。
save_problem_images: y

# 排序规则：recognition 为空字符串时，是否排到当前 algoType 的最后。
empty_recognition_last: y

# 排序规则：是否在同一个 algoType 内，把相同 recognition 的图片聚到一起。
cluster_by_recognition: y

# Web 默认图片缩放比例。1 表示完整适配显示；大于 1 会默认放大。
default_zoom: 1

# Web 是否显示“按时点击”按钮和 ms 下拉框。
# 只有 yes 才显示；其他值都会隐藏且禁用，避免客户看到。
show_auto_click: yes

# Web 是否显示“一键为对”按钮。
# 只有 yes 才显示；按钮只会把当前 algoType 类别全部判定为“对”，然后跳到下一个类别。
show_mark_all_correct: yes

# Web“按时点击”的可选时间，单位 ms；页面默认选择第一项。
auto_click_times_ms:
  - 450
  - 750
  - 950


# Web 默认判错规则：未标注图片的 recognition 命中这些字符串时，页面默认选中“错”。
# 开启“按时点击”后，命中项到时间会自动保存为“错”并跳到下一张。
default_wrong_keywords:
  - 失败

# Web 默认问题图片规则：未标注图片的 recognition 命中这些字符串时，页面默认选中“问题图片”。
# 优先级高于 default_wrong_keywords；开启“按时点击”后，命中项会自动保存为“问题图片”。
default_problem_keywords:
  - 分析为空
  - 设备不在线

# 问题图片清单.xlsx 额外收录规则。
# 默认 n：只收录人工/自动判定为“错”和“问题图片”的点位。
# 设置 y 后，会额外把 recognition 命中 extra_xlsx_recognition_keywords 的点位也写入清单。
extra_xlsx_recognition_enabled: n

# 清单是否显示 auditStatus=1 的“算法正常”点位。
# 只有 yes 才显示，且固定排在“算法不准”与“问题图片”之后。
show_algorithm_normal: yes

# 清单图片宽度小于 8 厘米时，是否按比例放大到 8.41 厘米。
checklist_image_width_enabled: yes

# extra_xlsx_recognition_enabled: y 时生效。
# 非空字符串表示 recognition 包含该子字符串；"" 表示 recognition 为空。
extra_xlsx_recognition_keywords:
  - ""

# 导出 newwrap/newkeywords.txt 的分组关键字。
# 非空字符串表示 recognition 包含该子字符串；"" 表示 recognition 为空。
newkeywords:
  - 失败
  - 为空
  - 未识别
  - ""
  - 设备不在线

# Y/N/M 前置归并时的关键字排序和命中图片复制规则。
# recognition 命中这些字符串的图片会排到最后，并复制到 output 下的 image_日期 文件夹。
keywords:
  - 失败
  - 为空
  - 未识别

# Web hotkey settings. Values use browser KeyboardEvent.key names.
# Defaults keep original behavior: arrows move/mark, 0 marks correct, 2 toggles auto click.
web_hotkeys:
  previous: ArrowLeft
  next: ArrowRight
  correct: "0"
  problem: ArrowUp
  wrong: ArrowDown
  auto_click_toggle: "2"

# Web: show same-recognition batch mark button and result dropdown only when yes.
show_mark_same_recognition: yes

# Web 点位名称末端显示配置。
End_open: true
End_characters: 7
End_character_color: green

# 清单“解决方案”匹配规则。
# 判断情况和识别结果均按完整文本匹配。
Assess_the_situation:
  - situation: 算法不准
    Recognitio_Result:
      Result: 识别为空
      resolve: 1.确定预置位标定是否正常 2.确保标定无问题的前提下，重新采集图片交予算法训练，预计下周更新优化


  - situation: 算法不准
    Recognitio_Result:
      Result: 未识别
      resolve: 算法涉入

  - situation: 算法不准
    Recognitio_Result:
      Result: 正常
      resolve: 1.确定预置位标定是否正常 2.确保标定无问题的前提下，重新采集图片交予算法训练，预计下周更新优化

  - situation: 算法不准
    Recognitio_Result:
      Result: 分析失败
      resolve: 1.确定预置位标定是否正常 2.确保标定无问题的前提下，重新采集图片交予算法训练，预计下周更新优化

  - situation: 算法不准
    Recognitio_Result:
      Result: 未发现异常
      resolve: 1.确定预置位标定是否正常 2.确保标定无问题的前提下，重新采集图片交予算法训练，预计下周更新优化

  - situation: 问题图片
    Recognitio_Result:
      Result: 分析失败
      resolve: 1.图片存在模糊、黑白等影响识别因素


  - situation: 问题图片
    Recognitio_Result:
      Result: 识别为空
      resolve: 1.图片存在模糊、黑白等影响识别因素



  - situation: 问题图片
    Recognitio_Result:
      Result: 算法调用超时
      resolve: 1.系统偶发性异常或算法并发数不够,需要重新预置位验证


  - situation: 问题图片
    Recognitio_Result:
      Result: 未识别
      resolve: 1.图片存在模糊或黑白等无法识别情况，需要现场人员处理



# 清单“负责人”匹配规则。
# recognition 命中关键字时写入负责人；负责人只能是：算法调试、现场调试、误报无需调试。
