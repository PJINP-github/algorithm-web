        select_cls:
            - fhz_f
            - fhz_h
        trans_cls:
            fhz_f: 分
            fhz_h: 合

    isolator_glkg:
        desc: 隔离开关状态识别
        pipeline:
            1:
                base: base_yolo
                cls_names:
                    0: czdbss_f
                    1: czdbss_h
                    2: czdbss_yc
                    3: vxsbkh_f
                    4: vxsbkh_h
                    5: vxsbkh_yc
                    6: spsbkh_f
                    7: spsbkh_h
                    8: spsbkh_yc
                    9: spdbxz_f
                    10: spdbxz_h
                    11: spdbxz_yc
                    12: spdbss_f
                    13: spdbss_h
                    14: spdbss_yc
                param: *isolator_param 
                patch: defect
        select_cls:
            - czdbss_f
            - czdbss_h
            - czdbss_yc
            - vxsbkh_f
            - vxsbkh_h
            - vxsbkh_yc
            - spsbkh_f
            - spsbkh_h
            - spsbkh_yc
            - spdbxz_f
            - spdbxz_h
            - spdbxz_yc
            - spdbss_f
            - spdbss_h
            - spdbss_yc
        trans_cls:
            czdbss_f: 分
            czdbss_h: 合
            czdbss_yc: 不到位
            spdbss_f: 分
            spdbss_h: 合
            spdbss_yc: 不到位
            spdbxz_f: 分
            spdbxz_h: 合
            spdbxz_yc: 不到位
            spsbkh_f: 分
            spsbkh_h: 合
            spsbkh_yc: 不到位
            vxsbkh_f: 分
            vxsbkh_h: 合
            vxsbkh_yc: 不到位

