##########屏柜通用##########
            
    light_pgdzsd_mn:
        desc: mn屏柜大指示灯状态
        pipeline:
            1:
                base: base_yolo
                cls_names: *pg_cls_names
                param: *pg_param 
                patch: light_pgzsd
        select_cls:
            - dzsd_m
            - dzsd_red
            - dzsd_green
            - dzsd_yellow
            - dzsd_white
            - dzsd_blue
            - dzsd_other
        trans_cls:
            dzsd_blue: 亮蓝灯
            dzsd_green: 亮绿灯
            dzsd_m: 指示灯灭
            dzsd_other: 指示灯亮
            dzsd_red: 亮红灯
            dzsd_white: 亮白灯
            dzsd_yellow: 亮黄灯

    light_pgxzsd_mn:
        desc: mn屏柜小指示灯状态
        pipeline:
            1:
                base: base_yolo
                cls_names: *pg_cls_names
                param: *pg_param 
                patch: light_pgzsd
        select_cls:
            - xzsd_m
            - xzsd_red
            - xzsd_green
            - xzsd_yellow
            - xzsd_white
            - xzsd_blue
            - xzsd_other
        trans_cls:
            xzsd_blue: 亮蓝灯
            xzsd_green: 亮绿灯
            xzsd_m: 指示灯灭
            xzsd_other: 指示灯亮
            xzsd_red: 亮红灯
            xzsd_white: 亮白灯
            xzsd_yellow: 亮黄灯

    switch_pgbhyb_mn:
        desc: mn屏柜保护压板状态
        pipeline:
            1:
                base: base_yolo
                cls_names: *pg_cls_names
                param: *pg_param 
                patch: light_pgzsd
        select_cls:
            - kgg_ybh
            - kgg_ybf
            - kgg_wyb
        trans_cls:
            kgg_ybf: 压板分
            kgg_ybh: 压板合
            kgg_wyb: 无压板

    switch_pgkqkg_mn:
        desc: mn屏柜空开状态
        pipeline:
            1:
                base: base_yolo
                cls_names: *pg_cls_names
                param: *pg_param 
                patch: light_pgzsd
        select_cls:
            - kqkg_up
            - kqkg_down
            - kqkg_left
            - kqkg_right
        trans_cls:
            kqkg_down: 向下
            kqkg_left: 向左
            kqkg_right: 向右
            kqkg_up: 向上

    switch_pgxnbs_p:
        desc: 屏柜旋钮把手状态
        pipeline:
            1:
                base: base_yolo
                cls_names:
                    0: xn_bs
                kpt_dims: 2
                kpt_names:
                    - tail
                    - head
                param: *pgxnbs_param 
                patch: switch_pgxnbs_p
                pre_process:
                    - crop_by_roi
                select_cls:
                    - right
                    - right_up
                    - up
                    - left_up
                    - left
                    - left_bottom
                    - bottom
                    - right_bottom
                    - xn_bs
                trans_cls:
                    bottom: 向下
                    left: 向左
                    left_bottom: 左下
                    left_up: 左上
                    right: 向右
                    right_bottom: 右下
                    right_up: 右上
                    up: 向上
                    xn_bs: 旋钮把手

#########表计读数（指针）##########

    meter_blq_xl:
        desc: 避雷器泄漏电流表读数
        label:
            marks:
                value: float
        pipeline:
            1:
                base: base_yolo
                patch: meter_p1
                cls_names: *meter_cls_names
                kpt_dims: 2
                kpt_names:
                    - center_pointer
                param: *meter_p1_param 
            2:
                base: base_yolo
                patch: meter_p2
                cls_names:
                    0: box_pointer_black
                kpt_dims: 2
                kpt_names:
                    - mark_pointer_black
                param: *meter_p2_param 
            3:
                base: base_yolo
                patch: meter_p3
                cls_names:
                    0: box_number
                kpt_dims: 2
                kpt_names:
                    - mark
                param: *meter_p3_param

    meter_blq_zzjs:
        desc: 避雷器指针计数器读数
        pipeline:
            1:
                base: base_yolo
