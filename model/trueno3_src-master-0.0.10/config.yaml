# Trueno 模型能力到本地权重文件名的映射。
# Select_substring 命中多个文件时，按文件名中的 +YYYYMMDD.序号选择最新文件。
mapping:
  - desc: 屏柜小指示灯状态
    Select_substring: at-det-pg.m-yolov8det-pg
  - desc: 屏柜旋钮状态
    Select_substring: at-pose-pgxnbs.m-yolov8pose-pgxnbs
  - desc: 通用仪表 OCR
    Select_substring: at-dm-common-paddleocr.m-dm-ocr-meter-common-paddleocr
  - desc: P-MCNC 仪表姿态
    Select_substring: at-pmcnc-single.m-pmcnc-pose-marks-single


# 模型推理能力白名单及显示顺序；不在此列表中的能力不显示。
Algorithm_Order:
  - id: light_pgdzsd_mn
    desc: mn屏柜大指示灯状态
    substring: at-det-pg.m

  - id: light_pgxzsd_mn
    desc: mn屏柜小指示灯状态
    substring: at-det-pg.m

  - id: switch_pgbhyb_mn
    desc: mn屏柜保护压板状态
    substring: at-det-pg.m

  - id: switch_pgkqkg_mn
    desc: mn屏柜空开状态
    substring: at-det-pg.m
    
  - id: switch_pgxnbs_p
    desc: 屏柜旋钮把手状态
    substring: at-pose-pgxnbs.m

  - id: switch_cn_other
    desc: 其他型储能指示
    substring: at-det-fhzcn.m-yolov8det-cn

  - id: switch_fh_other
    desc: 其他型分合指示
    substring: at-det-fhzfh.m-yolov8det-fh

  - id: person
    desc: 人员闯入
    substring: at-det-person.m-yolov8det-person  

  - id: meter_digital_led
    desc: LED数值显示器读数
    substring: at-dm-common-paddleocr.m-dm-ocr-meter-common-paddleocr

  - id: meter_byq_yw
    desc: 变压器油温表读数
    substring: at-pmcnc-single.m-pmcnc-pose-marks-single

# 多模型调用推理链路；下拉框只展示 model_substring 对应的最终模型。
# antecedent_reasoning 按流水线先后顺序填写中间模型。
Multi_model_invocation_inference_chain:
  - chain:
      model_substring: at-pmcnc-single.m-pmcnc-pose-marks-single
      antecedent_reasoning:
        - at-pmcnc-single.m-pmcnc-pose-meter-single
        - at-pmcnc-single.m-pmcnc-pose-pointer-single
  - chain:
      model_substring: at-dm-common-paddleocr.m-dm-ocr-meter-common-paddleocr
      antecedent_reasoning:
        - at-dm-common.m-dm-seg-meter-common
